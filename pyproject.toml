[project]
name = "synthesis-methods"
version = "0.1.0"
description = "Shared registry of DNA-synthesis method definitions (capabilities, limits, pricing)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Micah Olivas", email = "mbolivas@stanford.edu" }]
dependencies = [
    "tomli; python_version < '3.11'",   # TOML parser backport; tomllib is stdlib on 3.11+
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthesis_methods"]
